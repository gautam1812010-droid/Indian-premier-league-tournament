<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cricket Premier League</title>

<style>
:root{
  --navy:#07152f;
  --navy2:#0c2145;
  --orange:#ff7a00;
  --gold:#ffb300;
  --white:#fff;
  --muted:#9fb0ca;
  --card:#10284e;
  --line:#203b63;
  --green:#35c878;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#061126;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#06122a,#123664 65%,#f06a00);
  padding:18px 16px 22px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 4px 20px #0008;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  max-width:1100px;
  margin:auto;
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--orange),var(--gold));
  display:grid;
  place-items:center;
  font-size:25px;
}

.brand h1{
  font-size:19px;
  margin:0;
}

.brand p{
  font-size:11px;
  color:#dce7f8;
  margin:3px 0 0;
}

/* NAVIGATION */

nav{
  max-width:1100px;
  margin:17px auto 0;
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:2px;
}

nav button{
  border:1px solid #ffffff25;
  background:#ffffff0d;
  color:#dce7f8;
  padding:9px 13px;
  border-radius:20px;
  white-space:nowrap;
  font-weight:700;
}

nav button.active{
  background:var(--orange);
  color:#fff;
  border-color:transparent;
}

/* MAIN */

main{
  max-width:1100px;
  margin:auto;
  padding:18px 14px 50px;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#102b54,#091a38);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"🏏";
  position:absolute;
  right:18px;
  bottom:-12px;
  font-size:100px;
  opacity:.08;
}

.eyebrow{
  color:#ffae45;
  font-weight:800;
  font-size:12px;
  letter-spacing:1.5px;
}

.hero h2{
  font-size:30px;
  margin:7px 0;
}

.hero p{
  color:var(--muted);
  margin:0;
  max-width:600px;
}

/* STAT CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:14px 0;
}

.stat,
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
}

.stat{
  padding:15px;
}

.stat b{
  font-size:25px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

/* SECTIONS */

.section{
  margin-top:22px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section h3{
  margin:0;
  font-size:20px;
}

.section-head small{
  color:#8fa4c2;
}

/* MATCH CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.match{
  padding:15px;
}

.matchtop{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:center;
  margin:14px 0;
}

.team{
  width:42%;
  font-weight:800;
}

.badge{
  width:45px;
  height:45px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:auto;
  background:#173762;
  border:1px solid #315684;
  font-weight:900;
}

.result{
  font-size:11px;
  color:var(--green);
  font-weight:800;
  margin-top:5px;
}

.upcoming{
  color:#ffb55c;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:12px;
  background:#ffffff0d;
  color:#a9bbd4;
  font-size:10px;
  font-weight:700;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  font-size:12px;
}

th,
td{
  padding:11px 8px;
  border-bottom:1px solid #ffffff0a;
  text-align:center;
}

th{
  color:#9fb0ca;
  background:#0b2040;
}

td:first-child,
th:first-child{
  text-align:left;
}

.rank{
  font-weight:900;
  color:#ffb14b;
}

.qualified{
  border-left:3px solid var(--green);
}

/* PLAYERS */

.playerrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 15px;
  border-bottom:1px solid #ffffff0a;
}

.playerrow:last-child{
  border:0;
}

.playername{
  font-weight:800;
}

.playerteam{
  font-size:11px;
  color:var(--muted);
}

.number{
  font-size:22px;
  font-weight:900;
  color:#ffae45;
}

/* TEAMS */

.teamgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.teamcard{
  padding:18px;
  text-align:center;
}

.teamlogo{
  width:60px;
  height:60px;
  border-radius:18px;
  background:linear-gradient(135deg,#183963,#0a1934);
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  font-size:18px;
  font-weight:900;
  border:1px solid #315684;
}

.teamcard p{
  margin:4px 0;
  color:var(--muted);
  font-size:12px;
}

/* PLAYOFFS */

.bracket{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  align-items:center;
}

.round h4{
  text-align:center;
  color:#ffae45;
}

.game{
  padding:12px;
  margin:12px 0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  font-size:12px;
}

.game div{
  padding:5px 0;
  border-bottom:1px solid #ffffff0a;
}

.game div:last-child{
  border:0;
}

.hidden{
  display:none;
}

.empty{
  padding:28px;
  text-align:center;
  color:var(--muted);
  background:var(--card);
  border-radius:16px;
  border:1px solid var(--line);
}

/* MOBILE */

@media(max-width:700px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .cards{
    grid-template-columns:1fr;
  }

  .teamgrid{
    grid-template-columns:repeat(2,1fr);
  }

  .bracket{
    grid-template-columns:1fr 1fr;
  }

  .hero h2{
    font-size:25px;
  }

  table{
    font-size:11px;
  }

  th,
  td{
    padding:9px 5px;
  }
}

/* =========================
   NRR CALCULATION
========================= */

function oversToBalls(overs){

  if(!overs) return 0;

  const parts = String(overs).split(".");

  return (
    Number(parts[0]) * 6 +
    Number(parts[1] || 0)
  );
}


function calculateTable(){

  const table = Object.fromEntries(

    DATA.teams.map(t => [

      t.id,

      {
        ...t,
        p:0,
        w:0,
        l:0,
        nr:0,
        pts:0,

        nrr:null,

        forRuns:0,
        forBalls:0,

        againstRuns:0,
        againstBalls:0
      }

    ])

  );


  /* RESULTS */

  DATA.matches

    .filter(m => m.status === "completed")

    .forEach(m => {

      if(!m.winner) return;

      table[m.winner].p++;
      table[m.winner].w++;
      table[m.winner].pts += 2;

      const loser =
        m.a === m.winner
          ? m.b
          : m.a;

      table[loser].p++;
      table[loser].l++;

    });


  /* INNINGS */

  DATA.innings.forEach(x => {

    if(!table[x.team]) return;

    table[x.team].forRuns += x.runs;

    table[x.team].forBalls +=
      oversToBalls(x.overs);

  });


  /* OPPONENT INNINGS */

  DATA.innings.forEach(x => {

    const match =
      DATA.matches.find(m => m.no === x.match);

    if(!match) return;

    const opponent =
      match.a === x.team
        ? match.b
        : match.a;

    if(!table[opponent]) return;

    table[x.team].againstRuns += x.runs;

    table[opponent].againstRuns += x.runs;

    table[opponent].againstBalls +=
      oversToBalls(x.overs);

  });


  /* NRR */

  Object.values(table).forEach(x => {

    if(
      x.forBalls &&
      x.againstBalls
    ){

      x.nrr =
        (x.forRuns / x.forBalls * 6) -
        (x.againstRuns / x.againstBalls * 6);

    }

  });


  /* SORT */

  return Object.values(table).sort(

    (a,b) =>

      b.pts - a.pts ||

      (b.nrr ?? -999) -
      (a.nrr ?? -999)

  );

}

}

function matchCard(m){

  return `

        <span class="pill">

          ${
            m.status === "completed"

          }

        </span>

      </div>


      <div class="teams">

        <div class="team">

          ${badge(m.a)}

          <div>
            ${team(m.a).name}
          </div>

          ${
            m.winner === m.a
              ? `<div class="result">
                   WINNER
                 </div>`
              : ""
          }

        </div>


        <b>VS</b>


        <div class="team">

          ${badge(m.b)}

          <div>
            ${team(m.b).name}
          </div>

          ${
            m.winner === m.b
              ? `<div class="result">
                   WINNER
                 </div>`
              : ""
          }

        </div>

      </div>


      ${
        m.status === "completed"

        ?

        `

          <div class="result">
            ${m.score}
          </div>

          <div
            style="
              color:#9fb0ca;
              font-size:11px;
              margin-top:7px;
            "
          >

            ${m.detail || ""}

          </div>

        `

        :

        `

          <div class="upcoming">

            Upcoming fixture

          </div>

        `

      }

    </div>

  `;

}

function tableHTML(){

  return `

    <table>

      <thead>

          <th># Team</th>

          <th>Mat</th>

          <th>W</th>

          <th>L</th>

          <th>NRR</th>

          <th>Pts</th>

        </tr>

      </thead>


      <tbody>

        ${

          table.map((x,i) => `

            <tr
              class="${i < 4 ? "qualified" : ""}"
            >

              <td>

                <span class="rank">

                  ${i + 1}

                </span>

                &nbsp;

                <b>
                  ${x.id}
                </b>

                ${x.name}

              </td>


              <td>
                ${x.p}
              </td>


              <td>
                ${x.w}
              </td>


              <td>
                ${x.l}
              </td>


              <td>

                ${
                  x.nrr === null

                    ? "—"

                    :

                    `${
                      x.nrr >= 0 ? "+" : ""
                    }${x.nrr.toFixed(3)}`
                }

              </td>


              <td>

                <b>
                  ${x.pts}
                </b>

              </td>

            </tr>

          `).join("")

        }

      </tbody>

    </table>

  `;

}

    html = `

      <section
        class="section"
        style="margin-top:0"
      >

        <div class="section-head">

          <h3>
            Match Centre
          </h3>

          <small>
            28 Matches
          </small>

        </div>


        <div class="cards">

          ${

            DATA.matches
              .map(matchCard)
              .join("")

          }

        </div>

      </section>

    `;

  }


  /* =====================
     POINTS TABLE
  ===================== */

  else if(p === "table"){

    html = `

      <section
        class="section"
        style="margin-top:0"
      >

        <div class="section-head">

          <h3>
            Points Table
          </h3>

          <small>
            Win = 2 Points
          </small>

        </div>


        ${tableHTML()}


        <p
          style="
            color:#8095b4;
            font-size:11px;
          "
        >

          NRR appears automatically when
          innings runs and overs are entered
          in the tournament data.

        </p>

      </section>

    `;

  }


  /* =====================
     TEAMS
  ===================== */

  else if(p === "teams"){

    html = `

      <section
        class="section"
        style="margin-top:0"
      >

        <div class="section-head">

          <h3>
            Teams
          </h3>

          <small>
            8 Franchises
          </small>

        </div>


        <div class="teamgrid">

          ${

            DATA.teams.map(t => `

              <div class="card teamcard">

                ${badge(t.id)}


                <h3>
                  ${t.name}
                </h3>


                <p>
                  Captain:
                  ${t.captain}
                </p>

              </div>

            `).join("")

          }

        </div>

      </section>

    `;

  }


  /* =====================
     STATS
  ===================== */

  else if(p === "stats"){

    const batting =
      [...DATA.batting]
        .sort((a,b) => b.runs - a.runs);


    const bowling =
      [...DATA.bowling]
        .sort((a,b) => b.wkts - a.wkts);


    html = `

      <section
        class="section"
        style="margin-top:0"
      >

        <div class="section-head">

          <h3>
            Orange Cap
          </h3>

          <small>
            Most Runs
          </small>

        </div>


        <div class="card">

          ${

            batting.map((x,i) => `

              <div class="playerrow">

                <div>

                  <div class="playername">

                    ${i + 1}.
                    ${x.name}

                  </div>


                  <div class="playerteam">

                    ${x.team}
                    •
                    ${team(x.team).name}

                  </div>

                </div>


                <div class="number">

                  ${x.runs}

                </div>

              </div>

            `).join("")

          }

        </div>

      </section>


      <section class="section">

        <div class="section-head">

          <h3>
            Purple Cap
          </h3>

          <small>
            Most Wickets
          </small>

        </div>


        <div class="card">

          ${

            bowling.map((x,i) => `

              <div class="playerrow">

                <div>

                  <div class="playername">

                    ${i + 1}.
                    ${x.name}

                  </div>


                  <div class="playerteam">

                    ${x.team}
                    •
                    ${team(x.team).name}

                  </div>

                </div>


                <div class="number">

                  ${x.wkts}

                </div>

              </div>

            `).join("")

          }

        </div>

      </section>


      <section class="section">

        <div class="section-head">

          <h3>
            Player of the Match
          </h3>

        </div>


        <div class="card">

          ${

            DATA.potm.map(x => `

              <div class="playerrow">

                <div>

                  <div class="playername">

                    Match ${x.match}
                    —
                    ${x.name}

                  </div>


                  <div class="playerteam">

                    ${x.team}

                  </div>

                </div>


                <div>
                  ⭐
                </div>

              </div>

            `).join("")

          }

        </div>

      </section>

    `;

  }


  /* =====================
     PLAYOFFS
  ===================== */

  else if(p === "playoffs"){

    html = `

      <section
        class="section"
        style="margin-top:0"
      >

        <div class="section-head">

          <h3>
            Playoffs
          </h3>

          <small>
            Top 4 Qualify
          </small>

        </div>


        <div class="bracket">


          <div class="round">

            <h4>
              Qualifier 1
            </h4>


            <div class="game">

              <div>
                1st
              </div>

              <div>
                2nd
              </div>

            </div>

          </div>



          <div class="round">

            <h4>
              Eliminator
            </h4>


            <div class="game">

              <div>
                3rd
              </div>

              <div>
                4th
              </div>

            </div>


            <h4>
              Qualifier 2
            </h4>


            <div class="game">

              <div>
                Loser Q1
              </div>

              <div>
                Winner Eliminator
              </div>

            </div>

          </div>



          <div class="round">

            <h4>
              Final
            </h4>


            <div class="game">

              <div>
                Winner Q1
              </div>

              <div>
                Winner Q2
              </div>

            </div>

          </div>



          <div class="round">

            <h4>
              Champion
            </h4>


            <div
              class="game"
              style="
                text-align:center;
                font-size:25px;
              "
            >

              🏆

            </div>

          </div>


        </div>

      </section>

    `;

  }


  /* =====================
     DISPLAY
  ===================== */

  $("app").innerHTML = html;

  window.scrollTo(0,0);

}


/* =========================
   START WEBSITE
========================= */

page("home");

</script>

</body>
</html>
